<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎙️ Media Podcasts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🎙️ Media Podcasts</h1>

  <div class="container">
    <!-- Audio Section -->
    <div class="column">
      <h2>🎧 Audio Section</h2>
      <select id="audio-select">
        <option value="">-- Select Audio --</option>
      </select>
      <div id="audio-container" class="media-container"></div>
    </div>

    <!-- Video Section -->
    <div class="column">
      <h2>🎬 Video Section</h2>
      <select id="video-select">
        <option value="">-- Select Video --</option>
      </select>
      <div id="video-container" class="media-container"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
